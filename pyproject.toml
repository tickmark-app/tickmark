[project]
name = "tickmark"
version = "0.0.1"
description = "A free, open-source on-screen ruler for every operating system."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Tickmark contributors" }]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.12,<6.13"]
keywords = ["ruler", "screen ruler", "pixel", "measure", "color picker", "design"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/tickmark-app/tickmark"
Issues = "https://github.com/tickmark-app/tickmark/issues"

[project.gui-scripts]
tickmark = "tickmark.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "import-linter>=2.15",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-qt>=4.5",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

# --- Ruff -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # likely bugs
    "UP",       # modern syntax
    "SIM",      # simpler code
    "C4",       # comprehensions
    "RET",      # return statements
    "PIE",      # unnecessary code
    "ERA",      # commented-out code
    "T20",      # print statements
    "PT",       # pytest style
    "N",        # naming
    "PL",       # pylint rules
    "RUF",      # ruff-specific
]
ignore = [
    "N802",     # Qt overrides use camelCase names such as paintEvent
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # literal values are the point of a test

# --- Pyright --------------------------------------------------------------

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- import-linter --------------------------------------------------------

[tool.importlinter]
root_package = "tickmark"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: ui may use platform and core, platform may use core"
type = "layers"
layers = ["tickmark.ui", "tickmark.platform", "tickmark.core"]

[[tool.importlinter.contracts]]
name = "Core logic stays free of Qt"
type = "forbidden"
source_modules = ["tickmark.core"]
forbidden_modules = ["PySide6", "shiboken6"]

# --- pytest and coverage --------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
qt_api = "pyside6"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tickmark"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
