name: Feature request
description: Suggest something Tickmark should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. What is hard about it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Tickmark help?
  - type: textarea
    id: alternatives
    attributes:
      label: Other tools you use for this
